[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "/bin/sh -c 'exec /bin/lightpanda serve --host :: --port \"${PORT:-8080}\" --advertise-host \"${RAILWAY_PRIVATE_DOMAIN:?missing private hostname}\" --log-level info'"
healthcheckPath = "/json/version"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
